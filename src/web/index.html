<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>job-hunter</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafaf9;
        --fg: #1c1917;
        --muted: #78716c;
        --line: #e7e5e4;
        --accent: #2563eb;
        font-family: system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1917;
          --fg: #f5f5f4;
          --muted: #a8a29e;
          --line: #44403c;
          --accent: #60a5fa;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
      }
      nav {
        display: flex;
        gap: 4px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      nav a {
        padding: 6px 10px;
        border-radius: 6px;
        color: var(--muted);
        text-decoration: none;
      }
      nav a[aria-current="page"] {
        color: var(--fg);
        background: var(--line);
      }
      main {
        padding: 16px;
        max-width: 1100px;
      }
      .muted {
        color: var(--muted);
      }
      a {
        color: var(--accent);
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      button {
        font: inherit;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--accent);
        color: white;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.link {
        background: none;
        border: none;
        padding: 0;
        color: var(--muted);
        text-decoration: underline;
      }
      .notice {
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .notice.error {
        border-color: #dc2626;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
        margin: 12px 0;
      }
      .filters input {
        width: 4em;
      }
      .filters input,
      .filters select {
        font: inherit;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-weight: 500;
      }
      .num {
        text-align: right;
      }
      main {
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./app.tsx"></script>
  </body>
</html>
