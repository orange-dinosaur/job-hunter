# Copy to data/search-profile.yaml and edit. `bun run jh profile:check` validates it.

# Job titles to search for.
roles:
  - Software developer
  - Backend developer

# A place with a search radius in km, or the word remote.
locations:
  - place: Bologna
    radius_km: 30
  - remote

# Lowest acceptable yearly gross salary in EUR. Leave empty for no floor.
salary_floor: 35000

contract_types:
  - permanent
  - fixed-term

# Two-letter codes of the languages an offer may be written in.
languages:
  - it
  - en

excluded_companies: []
excluded_sectors:
  - gambling

# How much each criterion counts in the fit score. Must sum to 100.
weights:
  role: 25
  skills: 25
  experience: 20
  domain: 10
  location: 20
  salary: 0

# Fit score cut-offs: Strong from 80, Apply from 70, Maybe from 55, Skip below.
bands:
  strong: 80
  apply: 70
  maybe: 55

# Days in Applied with no change before a follow-up reminder, then a second one.
follow_up_days: [7, 14]

# Rules that exclude an offer outright instead of lowering its score.
dealbreakers:
  - relocation outside Italy
